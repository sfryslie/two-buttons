spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-4-7
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_PROJECT_ID:}
          location: ${GOOGLE_LOCATION:us-central1}
          chat:
            options:
              model: gemini-2.0-flash
  messages:
    encoding: UTF-8
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

experiment:
  # Providers to run. Available: anthropic, openai, ollama, gemini
  enabled-providers:
    - anthropic
  # Human-readable label stamped into the output filename and JSON.
  # Override on the command line to distinguish runs:
  #   ./gradlew bootRun --args='--spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001 --experiment.model-label=claude-haiku-4-5-20251001'
  model-label: claude-opus-4-7
  # BCP 47 language tags. 25 supported:
  # en, es, fr, de, it, pt, ja, zh-CN, zh-TW, ko, ar, ru, ca (original 12, zh split into Simplified/Traditional)
  # hi, id, he, tr, sw, bn, af, ur, da, uk, fa, el (added)
  enabled-languages:
    - en
  output-dir: results
  dry-run: false

logging:
  level:
    com.sfryslie: INFO
    org.springframework.ai: WARN
    org.springframework: WARN
