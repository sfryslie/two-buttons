spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: 180s
      chat:
        options:
          model: claude-opus-4-7
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 180s
      chat:
        options:
          model: gpt-4o
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      timeout: 600s
      chat:
        options:
          model: llama3.2
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          options:
            model: gemini-2.0-flash
  messages:
    encoding: UTF-8

# xAI Grok — OpenAI-compatible endpoint, wired via GrokConfig.kt.
# Bean is only created when GROK_API_KEY is set.
# Override model at runtime: --grok.model=grok-4.20
# Example run:
#   ./gradlew bootRun --args="--experiment.enabled-providers=grok --experiment.model-label=grok-4.3 --grok.model=grok-4.3 ..."
grok:
  base-url: ${GROK_BASE_URL:https://api.x.ai/v1}
  api-key: ${GROK_API_KEY:}
  model: grok-4.3

experiment:
  # Providers to run. Available: anthropic, openai, ollama, gemini (Google GenAI API key)
  enabled-providers:
    - anthropic
  # Human-readable label stamped into the output filename and JSON.
  # Override on the command line to distinguish runs:
  #   ./gradlew bootRun --args='--spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001 --experiment.model-label=claude-haiku-4-5-20251001'
  model-label: claude-opus-4-7
  # BCP 47 language tags. 25 supported:
  # en, es, fr, de, it, pt, ja, zh-CN, zh-TW, ko, ar, ru, ca (original 12, zh split into Simplified/Traditional)
  # hi, id, he, tr, sw, bn, af, ur, da, uk, fa, el (added)
  enabled-languages:
    - en
  output-dir: results
  dry-run: false

scoring:
  # Enable scoring mode. Pair with --experiment.enabled-providers= to skip the experiment runner.
  # Score all: ./gradlew bootRun --args='--scoring.enabled=true --experiment.enabled-providers='
  # Calibrate: ./gradlew bootRun --args='--scoring.enabled=true --scoring.calibrate=true --experiment.enabled-providers='
  enabled: false
  # Run calibration-set.json against active scorers instead of scoring real data.
  calibrate: false
  # Number of calibration runs per case (temperature=0, checks determinism).
  calibration-runs: 3
  # Walk reruns/{lang}/{model}/ for input files.
  input-dir: reruns
  output-dir: scores
  # Which locales to score. Empty = all locales found in input-dir.
  target-locales: []
  # Which model labels to score. Empty = all models found for each locale.
  target-models: []
  # Re-score files even if a .score.json already exists.
  force: false
  # Scorer model config — override model or disable individual scorers on the CLI:
  #   --scoring.openai.model=gpt-4o-mini
  #   --scoring.ollama.enabled=false
  openai:
    enabled: true
    model: gpt-5.4-nano
  gemini:
    enabled: true
    model: gemini-3.1-flash-lite
  ollama:
    enabled: true
    model: qwen2.5

logging:
  level:
    com.sfryslie: INFO
    org.springframework.ai: WARN
    org.springframework: WARN
