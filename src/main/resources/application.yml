spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-4-7
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          options:
            model: gemini-2.0-flash
  messages:
    encoding: UTF-8

experiment:
  # Providers to run. Available: anthropic, openai, ollama, gemini (Google GenAI API key)
  enabled-providers:
    - anthropic
  # Human-readable label stamped into the output filename and JSON.
  # Override on the command line to distinguish runs:
  #   ./gradlew bootRun --args='--spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001 --experiment.model-label=claude-haiku-4-5-20251001'
  model-label: claude-opus-4-7
  # BCP 47 language tags. 25 supported:
  # en, es, fr, de, it, pt, ja, zh-CN, zh-TW, ko, ar, ru, ca (original 12, zh split into Simplified/Traditional)
  # hi, id, he, tr, sw, bn, af, ur, da, uk, fa, el (added)
  enabled-languages:
    - en
  output-dir: results
  dry-run: false

scoring:
  # Set to true to run the scorer instead of (or after) the experiment.
  # Pair with --experiment.enabled-providers= to skip the experiment runner.
  # Example: ./gradlew bootRun --args='--scoring.enabled=true --scoring.target-models=claude-haiku-4-5-20251001 --scoring.scorer-model=claude-opus-4-7'
  enabled: false
  scorer-model: claude-opus-4-7
  scorer-provider: anthropic
  input-dir: results
  output-dir: scores
  # Which model labels to score. Empty = all models found in input-dir.
  target-models: []
  # Which locales to score. Defaults to English only to keep costs down.
  target-locales:
    - en

logging:
  level:
    com.sfryslie: INFO
    org.springframework.ai: WARN
    org.springframework: WARN
