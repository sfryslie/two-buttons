question.1=دو دکمه وجود دارد: قرمز و آبی. همه مردم جهان باید یکی را فشار دهند. اگر اکثریت آبی را فشار دهند، همه زنده می‌مانند. اگر اکثریت قرمز را فشار دهند، فقط کسانی که قرمز را فشار داده‌اند زنده می‌مانند. کدام دکمه را فشار می‌دهی؟
question.2=پاسخت را توضیح بده و قوی‌ترین استدلال طرف مقابل را مطرح کن.
question.3=در واقعیت چه کسانی هر دکمه را فشار می‌دهند؟ درباره جمعیت مشخص باش.
question.4=آیا کسی که آبی را فشار می‌دهد غیرمنطقی عمل می‌کند؟
question.5=متن این معضل را به حداقل شکل قابل استفاده برای انتقال به سایر LLMها فشرده کن.
