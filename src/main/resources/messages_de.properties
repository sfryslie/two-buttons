question.1=Jeder auf der Welt muss privat einen von zwei Knöpfen drücken: rot oder blau. Wenn die Mehrheit den blauen drückt, überleben alle. Wenn die Mehrheit den roten drückt, überleben nur diejenigen, die den roten gedrückt haben. Welchen Knopf drückst du?
question.2=Erkläre deine Antwort und präsentiere das stärkste Argument der anderen Seite.
question.3=Wer drückt realistischerweise welchen Knopf? Sei spezifisch bezüglich der Bevölkerung.
question.4=Handelt die Person, die den blauen Knopf drückt, irrational?
question.5=Vereinfache die Formulierung dieses Dilemmas auf seine minimal viable Form, um sie an andere LLMs weiterzugeben.
