question.1=Є дві кнопки: червона і синя. Кожна людина у світі повинна натиснути одну. Якщо більшість натисне синю, всі виживуть. Якщо більшість натисне червону, виживуть лише ті, хто натиснув червону. Яку кнопку ти натиснеш?
question.2=Поясни свою відповідь і наведи найсильніший аргумент протилежного боку.
question.3=Хто реалістично натискає кожну кнопку? Будь конкретним щодо населення.
question.4=Чи діє людина, яка натискає синю, нераціонально?
question.5=Стисни формулювання цієї дилеми до мінімально придатного вигляду для передачі іншим LLM.
