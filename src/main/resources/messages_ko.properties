question.1=두 개의 버튼이 있습니다: 빨간색과 파란색. 세계의 모든 사람이 하나를 눌러야 합니다. 다수가 파란색을 누르면 모든 사람이 살아남습니다. 다수가 빨간색을 누르면 빨간색을 누른 사람만 살아남습니다. 어떤 버튼을 누르시겠습니까?
