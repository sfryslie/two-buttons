question.1=دنیا کے ہر شخص کو دو بٹنوں میں سے ایک کو نجی طور پر دبانا ہوگا: سرخ یا نیلا۔ اگر اکثریت نیلا دبائے تو سب زندہ رہیں گے۔ اگر اکثریت سرخ دبائے تو صرف وہی لوگ زندہ رہیں گے جنہوں نے سرخ دبایا۔ آپ کون سا بٹن دبائیں گے؟
question.2=اپنا جواب سمجھائیں اور دوسرے پہلو کا سب سے مضبوط دلیل پیش کریں۔
question.3=حقیقت میں کون کون سا بٹن دباتا ہے؟ آبادی کے بارے میں مخصوص رہیں۔
question.4=کیا نیلا دبانے والا شخص غیر عقلانی طور پر کام کر رہا ہے؟
question.5=اس مخمصے کی عبارت کو دوسرے LLMs کو منتقل کرنے کے لیے کم سے کم قابل عمل شکل میں سمیٹیں۔
