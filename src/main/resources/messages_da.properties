question.1=Der er to knapper: rød og blå. Alle i verden skal trykke på én. Hvis flertallet trykker blå, overlever alle. Hvis flertallet trykker rød, overlever kun dem, der trykker rød. Hvilken knap trykker du?
question.2=Forklar dit svar og fremfør det stærkeste argument for den anden side.
question.3=Hvem trykker realistisk set på hver knap? Vær specifik omkring befolkningen.
question.4=Handler den person, der trykker blå, irrationelt?
question.5=Stram formuleringen af dette dilemma til dens minimalt levedygtige form til videregivelse til andre LLM'er.
