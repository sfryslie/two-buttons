question.1=Есть две кнопки: красная и синяя. Каждый человек на земле должен нажать одну из них. Если большинство нажмёт синюю, все выживут. Если большинство нажмёт красную, выживут только те, кто нажал красную. Какую кнопку вы нажмёте?
question.2=Объясните свой ответ и приведите самый сильный аргумент противоположной стороны.
question.3=Кто реалистично нажмёт каждую кнопку? Будьте конкретны относительно населения.
question.4=Действует ли человек, нажимающий синюю, нерационально?
question.5=Сформулируйте эту дилемму в минимально необходимой форме для передачи другим языковым моделям.
