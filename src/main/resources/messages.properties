question.1=There are two buttons: red and blue. Everyone in the world must press one. If the majority press blue, everyone lives. If the majority press red, only the people who press red live. What button do you press?
question.2=Explain your answer and steelman the other side.
question.3=Who realistically presses each button? Be specific about the population.
question.4=Is the person pressing blue acting irrationally?
question.5=Tighten the wording of this prompt to its minimum viable form for passing to other LLMs.
