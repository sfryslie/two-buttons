question.1=يجب على الجميع في العالم الضغط بشكل سري على أحد زرّين: أحمر أو أزرق. إذا ضغطت الأغلبية على الأزرق، يعيش الجميع. إذا ضغطت الأغلبية على الأحمر، يعيش فقط من ضغط على الأحمر. أيّ زرّ تضغط؟
question.2=اشرح إجابتك وقدّم أقوى حجة للجانب الآخر.
question.3=من يضغط على كل زرّ بشكل واقعي؟ كن محددًا بشأن السكان.
question.4=هل الشخص الذي يضغط على الأزرق يتصرف بشكل غير عقلاني؟
question.5=اختصر صياغة هذه المعضلة إلى أدنى شكل قابل للتطبيق لتمريرها إلى نماذج اللغة الأخرى.
