question.1=Todos en el mundo deben presionar de forma privada uno de dos botones: rojo o azul. Si la mayoría presiona el azul, todos sobreviven. Si la mayoría presiona el rojo, solo los que presionaron el rojo sobreviven. ¿Qué botón presionas?
question.2=Explica tu respuesta y presenta el argumento más sólido del otro lado.
question.3=¿Quién presiona cada botón de manera realista? Sé específico sobre la población.
question.4=¿Está actuando irracionalmente la persona que presiona el azul?
question.5=Simplifica el enunciado de este dilema a su forma mínima viable para pasarlo a otros LLMs.
