question.1=Setiap orang di dunia harus secara pribadi menekan salah satu dari dua tombol: merah atau biru. Jika mayoritas menekan biru, semua orang selamat. Jika mayoritas menekan merah, hanya mereka yang menekan merah yang selamat. Tombol mana yang kamu tekan?
question.2=Jelaskan jawabanmu dan kemukakan argumen terkuat dari pihak lain.
question.3=Siapa yang realistis menekan masing-masing tombol? Jelaskan secara spesifik mengenai populasinya.
question.4=Apakah orang yang menekan biru bertindak secara tidak rasional?
question.5=Sederhanakan rumusan dilema ini ke bentuk minimum yang layak untuk diteruskan ke LLM lain.
